name: Scrape TSE results

# Scrapes the official TSE results page (Eleição 6257 - Presidente, Brasil)
# every minute and commits a timestamped JSON snapshot to the data/ folder.
#
# Note: GitHub Actions scheduled workflows run at best every ~5 minutes in
# practice (infrastructure load permitting); "* * * * *" requests the maximum
# allowed frequency. Scheduled workflows only run from the DEFAULT branch,
# so this file must be on the default branch for the schedule to take effect.

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-tse-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and commit snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scripts/scrape_tse.py

      - name: Commit and push new snapshot
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git commit -m "data: TSE presidente snapshot $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BRANCH" && \
              git push origin "HEAD:$BRANCH" && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Could not push after 5 attempts."
          exit 1
